<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & Mermaid Visualizer - 統合プレビューアプリ</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>HTML & Mermaid Visualizer</h1>
            <p class="subtitle">HTML + Mermaid図表を統合プレビュー</p>
        </header>

        <div class="controls">
            <div class="control-buttons">
                <button id="clearBtn" class="btn">クリア</button>
                <button id="sampleBtn" class="btn btn-secondary">サンプルを読み込む</button>
                <button id="saveHistoryBtn" class="btn btn-primary">履歴を保存</button>
                <button id="historyBtn" class="btn btn-secondary">履歴</button>
            </div>
        </div>

        <div class="main-content">
            <div class="editor-section">
                <h2>HTML + Mermaid コード入力</h2>
                <textarea
                    id="htmlInput"
                    placeholder="HTMLとMermaidを統合して記述できます&#10;&#10;Mermaid図表は ```mermaid ブロックで囲んでください:&#10;&#10;<h1>タイトル</h1>&#10;<p>説明文</p>&#10;&#10;```mermaid&#10;graph LR&#10;    A[開始] --> B[終了]&#10;```"
                    spellcheck="false"
                ></textarea>
            </div>

            <div class="preview-section">
                <div class="preview-header">
                    <h2>プレビュー</h2>
                    <button id="maximizeBtn" class="btn-icon" title="プレビューを最大化">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                        </svg>
                    </button>
                </div>
                <iframe
                    id="preview"
                    sandbox="allow-same-origin allow-scripts"
                    title="HTMLプレビュー"
                ></iframe>
            </div>
        </div>

        <footer>
            <p>HTMLコードを安全に表示するためsandbox属性を使用しています</p>
        </footer>
    </div>

    <!-- 最大化モード用オーバーレイ -->
    <div id="maximizedOverlay" class="maximized-overlay hidden">
        <div class="maximized-header">
            <h2>プレビュー（最大化）</h2>
            <button id="closeMaximizeBtn" class="btn-close" title="閉じる (ESC)">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <iframe
            id="previewMaximized"
            sandbox="allow-same-origin allow-scripts"
            title="HTMLプレビュー（最大化）"
        ></iframe>
    </div>

    <!-- 履歴管理モーダル -->
    <div id="historyOverlay" class="history-overlay hidden">
        <div class="history-modal">
            <div class="history-header">
                <h2>履歴管理</h2>
                <button id="closeHistoryBtn" class="btn-close" title="閉じる (ESC)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="history-controls">
                <button id="clearAllHistoryBtn" class="btn btn-danger">全て削除</button>
                <p class="history-count">保存済み: <span id="historyCount">0</span> 件</p>
            </div>
            <div class="history-content" id="historyContent">
                <p class="history-empty">保存された履歴がありません</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
